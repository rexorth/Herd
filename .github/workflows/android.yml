name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the dev-build release below
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test shared module, build debug APK, run lint
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: herd-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      # A plain .apk you can tap to install on a phone, at a link that never changes:
      # https://github.com/<owner>/<repo>/releases/tag/dev-build. Replaced on every push.
      - name: Publish dev-build release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk herd-debug.apk
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build herd-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Herd dev build" \
            --notes "Debug build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Tap herd-debug.apk below to download and install."

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/testAndroidHostTest/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore
