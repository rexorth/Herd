[versions]
# Kotlin, AGP and Compose are pinned to the versions maplibre-compose 0.20.0 builds with.
agp = "9.3.1"
kotlin = "2.4.20"
compose-multiplatform = "1.12.1"
compose-material3 = "1.12.0-alpha03"
androidx-activity = "1.13.0"
maplibre-compose = "0.20.0"
# Ktor, serialization and coroutines match the versions maplibre-compose 0.20.0 depends on.
ktor = "3.6.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
androidx-lifecycle = "2.11.0"
# Turn-by-turn navigation. Android-only (Rust core through JNA), so it's used from androidApp.
ferrostar = "0.59.0"
sqldelight = "2.4.1"
# Ferrostar's AAR requires core library desugaring (java.time on older Android).
desugar-jdk-libs = "2.1.5"
# Ferrostar's route requests go through OkHttp. Same version Ktor's OkHttp engine resolves to.
okhttp = "5.5.0"

android-compileSdk = "37"
android-targetSdk = "36"
# Ferrostar needs 25.
android-minSdk = "25"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose", version.ref = "maplibre-compose" }
maplibre-compose-material3 = { module = "org.maplibre.compose:maplibre-compose-material3", version.ref = "maplibre-compose" }
# Renderer backend packaged into the APK. maplibre-compose ships it separately (OpenGL or Vulkan).
maplibre-compose-runtime-opengl = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-android", version.ref = "maplibre-compose" }
maplibre-location = { module = "org.maplibre.compose:location", version.ref = "maplibre-compose" }
# Google Play Services fused location backend for maplibre-compose's location provider.
maplibre-location-gms = { module = "org.maplibre.compose:location-runtime-gms", version.ref = "maplibre-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
# In-memory SQLite on the JVM, for host tests.
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
ferrostar-core = { module = "com.stadiamaps.ferrostar:core", version.ref = "ferrostar" }
ferrostar-googlePlayServices = { module = "com.stadiamaps.ferrostar:google-play-services", version.ref = "ferrostar" }
# Maneuver banner, trip progress and the navigation notification. Not ui-maplibre: it pins an
# older maplibre-compose, so Herd draws navigation on its own map.
ferrostar-uiCompose = { module = "com.stadiamaps.ferrostar:ui-compose", version.ref = "ferrostar" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
